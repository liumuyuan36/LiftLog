<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiftLog · 3D 图像工作室</title><style>body{margin:0;background:#eef1ed;color:#294332;font:14px system-ui}header{display:flex;gap:12px;padding:18px 25px;background:white;align-items:center;flex-wrap:wrap}header strong{margin-right:20px}button,select{font:inherit;padding:10px 15px;border-radius:10px;border:1px solid #d3ddcf;background:#fff;color:#355536}button.active{background:#294e38;color:white}main{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:25px;max-width:1150px;margin:25px auto;padding:0 20px}.stage{min-height:650px;background:radial-gradient(ellipse,#fff,#e8ede5);border-radius:22px;display:flex;align-items:center;justify-content:center;overflow:hidden}canvas{display:block;max-width:100%;max-height:760px;object-fit:contain}aside{line-height:1.9}#status{white-space:pre-wrap}#gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#gallery img{width:100%;background:#f7f9f4;border-radius:10px}#export{background:#294e38;color:#fff}#summary{font-size:12px;color:#7b8b72}</style>
